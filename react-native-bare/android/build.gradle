buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20" // RN 0.86 template value; moves with the template
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        def krdpassLocalMavenRepo = providers.gradleProperty('krdpassLocalMavenRepo').orNull?.trim()
        if (krdpassLocalMavenRepo) {
            maven { url = uri(krdpassLocalMavenRepo) }
        }
        google()
        mavenCentral()
    }
}
