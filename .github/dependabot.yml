# Keeps GitHub Actions (SHA-pinned) and each sample app's dependencies monitored for
# updates and security advisories.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pub"
    directory: "/flutter"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/react-native"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Expo SDK upgrades are coordinated platform migrations, not independent
    # package bumps. SDK 56/57 require newer React Native, Node, iOS, and Xcode
    # matrices than this currently deployable SDK 55 sample.
    ignore:
      - dependency-name: "expo*"
        versions: [">=56.0.0"]
      - dependency-name: "babel-preset-expo"
        versions: [">=56.0.0"]
      - dependency-name: "eslint-config-expo"
        versions: [">=56.0.0"]
      - dependency-name: "react"
        versions: [">19.2.0"]
      - dependency-name: "react-native"
        versions: [">0.83.6"]
      - dependency-name: "react-native-get-random-values"
        versions: [">=2.0.0"]
      - dependency-name: "react-native-safe-area-context"
        versions: [">5.6.2"]
      - dependency-name: "react-native-svg"
        versions: [">15.15.3"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
